<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Login</mat-card-title>
      <mat-card-subtitle>Ingresa para continuar</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form (submit)="onSubmit($event)" class="login-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Usuario</mat-label>
          <input matInput name="username" required />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" name="password" required />
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" appearance="outline" class="full-width">
          Ingresar
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
