<mat-toolbar color="primary" *ngIf="isLoggedIn()">
  <button mat-icon-button (click)="drawer.toggle()">
    <mat-icon>menu</mat-icon>
  </button>
  <span>Gestor de Tickets</span>
  <span class="spacer"></span>
  
  <div class="theme-toggle">
    <mat-icon>{{ themeService.isDarkMode() ? 'dark_mode' : 'light_mode' }}</mat-icon>
    <mat-slide-toggle 
      [checked]="themeService.isDarkMode()"
      (change)="themeService.toggleTheme()"
      color="accent">
    </mat-slide-toggle>
  </div>
  
  <button mat-button (click)="logout()">
    <mat-icon>logout</mat-icon>
    Logout
  </button>
</mat-toolbar>

<mat-drawer-container class="container" *ngIf="isLoggedIn()">
  <mat-drawer #drawer [mode]="drawerMode" [opened]="drawerOpened" class="side-drawer">
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active" (click)="isMobile && drawer.close()">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/tickets" routerLinkActive="active" (click)="isMobile && drawer.close()">
        <mat-icon matListItemIcon>confirmation_number</mat-icon>
        <span matListItemTitle>Tickets</span>
      </a>
    </mat-nav-list>
  </mat-drawer>

  <mat-drawer-content>
    <div class="app-content" [@routeAnimations]="getRouteAnimationData()">
      <router-outlet></router-outlet>
    </div>
  </mat-drawer-content>
</mat-drawer-container>

<div class="login-container" *ngIf="!isLoggedIn()">
  <router-outlet></router-outlet>
</div>

<app-logout-screen *ngIf="isLoggingOut"></app-logout-screen>
